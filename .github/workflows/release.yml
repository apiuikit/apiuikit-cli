name: Release

# Changesets-driven release: on every push to main, changesets/action either
# opens/updates a "Version Packages" PR (when changeset files are pending) or,
# once that PR is merged, publishes the package to npm via `npm run release`.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Publishes via npm's OIDC "Trusted Publisher" flow (id-token: write
      # above) — no NPM_TOKEN secret needed, as long as this repo + workflow
      # are registered as a trusted publisher for @apiuikit/cli on npmjs.com.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
