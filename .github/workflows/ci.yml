name: CI

# Reusable — invoked by release.yml as its required first job (`needs: ci`),
# plus pull_request to test PR branches and workflow_dispatch for manually
# running it standalone.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
